<form method="post" action="{% url 'po-eta-status-update' po.pk %}" class="d-flex gap-1">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <input
        type="text"
        name="eta_status"
        value="{{ po.eta_status }}"
        class="form-control form-control-sm"
        placeholder="e.g. Delayed 3 days"
        maxlength="255"
    >
    <button type="submit" class="btn btn-sm btn-outline-secondary">Save</button>
</form>
