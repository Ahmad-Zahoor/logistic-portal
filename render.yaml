databases:
  - name: logistic-portal-db
    plan: free
    databaseName: logistic_portal
    user: logistic_portal

services:
  - type: web
    name: logistic-portal
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn logistic_portal.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: logistic-portal-db
          property: connectionString
