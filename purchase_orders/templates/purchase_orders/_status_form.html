<form method="post" action="{% url 'po-status-update' po.pk %}" class="d-inline-flex gap-1">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next_url }}">
    <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
        {% for value, label in status_choices %}
        <option value="{{ value }}" {% if value == po.status %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
    </select>
</form>
